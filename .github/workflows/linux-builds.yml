name: linux-builds

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            artifact: linux-x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tcl tcl-dev tk tk-dev \
            build-essential libxcursor-dev xvfb

      - name: Build
        run: |
          ./configure \
            --prefix=${{ github.workspace }}/cmake/runtime \
            --exec-prefix=${{ github.workspace }}/cmake/runtime
          make -j$(nproc)
          make install

      - name: Check configure output (issue #76 regression)
        run: bash tests/check_configure_output.sh config.log

      - name: Run Tcl-level regression tests (issues #6, #66, #77)
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1
          DISPLAY=:99 TCLLIBPATH="${{ github.workspace }}/cmake/runtime/lib" \
            tclsh tests/all.tcl

      - name: Upload artifact
        uses: actions/upload-artifact@v4.3.5
        with:
          name: ${{ matrix.artifact }}
          path: cmake/runtime/lib/tkdnd${{ steps.version.outputs.version }}
